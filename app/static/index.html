<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persian Speed ALPR & Radar Control</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="dark-theme">

  <!-- Header -->
  <header class="app-header">
    <div class="header-brand">
      <span class="brand-title">RADAR-ALPR <span class="brand-tag">PERSIAN AI</span></span>
    </div>
    <div class="header-actions">
      <div class="connection-status" id="wsStatus">
        <span class="status-indicator"></span>
        <span class="status-text">Connecting...</span>
      </div>
      <button class="btn" id="btnOpenCalibration">Radar Calibration</button>
    </div>
  </header>

  <!-- Metric Banner -->
  <section class="stats-banner">
    <div class="stat-box">
      <span class="stat-label">TOTAL VIOLATIONS</span>
      <span class="stat-value" id="statTotalViolations">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">MAX SPEED</span>
      <span class="stat-value text-red" id="statMaxSpeed">0.0 <small>km/h</small></span>
    </div>
    <div class="stat-box">
      <span class="stat-label">AVG INFRACTION</span>
      <span class="stat-value text-yellow" id="statAvgSpeed">0.0 <small>km/h</small></span>
    </div>
    <div class="stat-box">
      <span class="stat-label">SPEED LIMIT</span>
      <div class="limit-input-group">
        <input type="number" id="inputSpeedLimit" value="60" min="20" max="180">
        <button id="btnSetLimit" class="btn-sm">SET</button>
      </div>
    </div>
  </section>

  <!-- Main View -->
  <main class="main-layout">
    
    <!-- Left: Video Area -->
    <section class="left-pane">
      
      <!-- Compact Top Controls Bar -->
      <div class="top-controls-bar">
        <!-- Upload -->
        <label for="videoFileInput" class="upload-btn-box" id="dropZone">
          <input type="file" id="videoFileInput" accept="video/mp4,video/avi,video/mkv,video/mov" hidden>
          <span class="upload-icon">&#128194;</span>
          <div class="upload-meta">
            <span class="upload-title">Choose / Drop Video</span>
            <span class="upload-sub" id="videoMetaText">No video loaded</span>
          </div>
        </label>

        <!-- Rotation Control -->
        <div class="rotation-bar">
          <div class="rotation-meta">
            <span class="ctrl-label">ORIENTATION</span>
            <span class="angle-badge" id="currentAngleBadge">0°</span>
          </div>
          <div class="angle-btn-group">
            <button type="button" class="angle-btn active" data-angle="0">0°</button>
            <button type="button" class="angle-btn" data-angle="90">90°</button>
            <button type="button" class="angle-btn" data-angle="180">180°</button>
            <button type="button" class="angle-btn" data-angle="270">270°</button>
          </div>
        </div>
      </div>

      <div class="upload-progress-wrap" id="uploadProgressContainer" style="display: none;">
        <div class="upload-progress-fill" id="uploadProgressBar"></div>
      </div>

      <!-- Video Stream Box -->
      <div class="video-container">
        <div class="video-stage">
          <img id="liveStreamFeed" src="/static/placeholder.png" alt="Stream Preview">
          <div class="video-overlay" id="streamOverlayPlaceholder">
            <span>Upload a video above to begin ALPR processing</span>
          </div>
        </div>
        <div class="video-bottom-bar">
          <div class="btn-group">
            <button class="btn btn-green" id="btnStartStream" disabled>Start</button>
            <button class="btn btn-red" id="btnStopStream" disabled>Stop</button>
          </div>
        </div>
      </div>

    </section>

    <!-- Right: Violations Log -->
    <aside class="right-pane">
      <div class="pane-header">
        <span class="pane-title">VIOLATIONS LOG</span>
        <span class="badge" id="violationCountBadge">0</span>
      </div>
      <div class="violations-feed" id="violationsList">
        <div class="empty-state" id="emptyViolationsState">No infractions detected</div>
      </div>
    </aside>

  </main>

  <!-- Calibration Modal -->
  <div class="modal-backdrop" id="calibrationModal" style="display: none;">
    <div class="modal-window">
      <div class="modal-header">
        <h3>Radar Calibration (Select 4 Points)</h3>
        <button class="btn-close" id="btnCloseCalibration">&times;</button>
      </div>
      <div class="modal-body">
        <div class="canvas-wrap">
          <canvas id="calibrationCanvas"></canvas>
        </div>
        <div class="calib-inputs">
          <label>Road Width (m): <input type="number" id="calibRoadWidth" value="3.5" step="0.1"></label>
          <label>Road Length (m): <input type="number" id="calibRoadLength" value="20.0" step="0.5"></label>
          <div class="modal-actions">
            <button class="btn" id="btnResetCalibPoints">Reset</button>
            <button class="btn btn-green" id="btnSaveCalibration">Save Calibration</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
